<!DOCTYPE html>
<html>
    <head>
        <title>Deadline 4</title>
        <meta charset="utf-8">
        <style>
            body {
                font-family: 'Times New Roman', Times, serif;
                margin: 20px;
                background-color: #6dd0f4;
                margin: 0 auto;
                width: 100%;
                height: 100%;
                box-sizing: border-box;
            }

            .container {
                background-color: #00f8f8cb;
                border-radius: 30px;
                font-weight: bold;
                font-size: 40px;
                border-color: black;
                border-style: solid;
                width: 50%;
                height: 15%;
                text-align: center;
                margin: auto;
            }
            #logo {                
                text-align: center;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <body>
        <form action="/submit-your-form" method="post">
            <table>
                <caption>
                    <div class="container">
                    <div id="logo">Jackson</div>
                    <div style="border: 3px solid black; width:99%; margin-left:0px; padding:0px"></div>
                    <div id="logo">Electrics</div>
                    </div>                  
                </caption>
                <caption><h1>Registration Form</h1></caption>
                <caption>Register your Jackson Electrics product here</caption>
                <tr>
                     <td><label for="firstname">First Name:</label></td>
                     <td colspan="2"><input type="text" id="firstname" name="firstname"size="20">
                     <label for="lastname">Last Name:</label>
                     <input type="text" id="lastname" name="lastname"></td>
                </tr>
                <tr>
                    <td><label for="address#1">Address #1:</label></td>
                    <td><input type="text" id="address#1" name="address#1" size="40"></td>
                </tr>
                <tr>
                    <td><label for="address#2">Address #2:</label></td>
                    <td><input type="text" id="address#2" name="address#2" size="40"></td>
                </tr>
                <tr>
                    <td><label for="city">City:</label></td>
                    <td colspan="3"><input type="text" id="city" name="city" size="25">
                    <label for="state">State:</label>
                    <input type="text" id="state" name="state" size="3">
                    <label for="zip">Zip:</label>
                    <input type="text" id="zip" name="zip" size="8">
                    </td>
                </tr>
                <tr>
                    <td><label for="country">Country:</label></td>
                    <td><input type="text" id="country" name="country" value="United States"></td>
                </tr>
                <tr>
                    <td colspan="6"><hr></td>
                </tr>
                <tr>
                    <td><label for="product">Product:</label></td>
                    <td>
                        <select id="product" name="product">
                            <option value="scanmaster">ScanMaster</option>
                        </select>
                    </td>
                </tr>
                <tr>
                     <td><label for="datePurchased">Date Purchased:</label></td>
                    <td><input type="text" id="datePurchased" name="datePurchased"></td>
                </tr>
                <tr>
                     <td><label for="serialNumber">Serial #:</label></td>
                    <td><input type="text" id="serialNumber" name="serialNumber"></td>
                </tr>
                <tr>
                    <td><label for="usedfor">Used for:</label></td>
                    <td><input type="radio" id="usedfor" name="usedfor">Home</td>
                    <td><input type="radio" id="usedfor" name="usedfor">Educational Institution</td>
                </tr>
                <tr>
                <td><label for="usedfor"></label></td>
                    <td><input type="radio" id="usedfor" name="usedfor">Business</td>
                    <td><input type="radio" id="usedfor" name="usedfor" value="Other">Other</td>
                </tr>
                <tr>
                <td><label for="usedfor"></label></td>
                    <td><input type="radio" id="usedfor" name="usedfor">Government</td>
                </tr>
                <tr>
                    <td><label for="system">System (check all that apply):</label></td>
                    <td><input type="checkbox" id="system1" name="system" value="Windows">Windows</td>
                    <td><input type="checkbox" id="system2" name="system" value="UNIX">UNIX</td>
                </tr>
                <tr>
                    <td><label for="system"></label></td>
                    <td><input type="checkbox" id="system3" name="system" value="Macintosh">Macintosh</td>
                    <td><input type="checkbox" id="system4" name="system" value="Other">Other</td>
                </tr>
                <tr>
                    <td colspan="6"><hr></td>
                </tr>
                <tr>
                    <td><label for="comments">Comments?:</label></td>
                    <td colspan="70"><textarea name="txtComments" rows="10" cols="70"></textarea></td>
                </tr>
                <tr>
                    <td></td><label for="button"></label></td>
                    <td>
                    <input type="submit" value="Click to register">
                    <input type="submit" value="Click to cancel">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
